name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Restore
        run: dotnet restore FortniteMatchCompiler.sln

      - name: Build
        run: dotnet build FortniteMatchCompiler.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet run --project tests/FortniteMatchCompiler.Tests/FortniteMatchCompiler.Tests.csproj --configuration Release --no-build -- --ffmpeg-integration
